name: sptm
description: Student Task & Performance Manager - A comprehensive task management and academic performance tracking application.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^2.24.0
  firebase_auth: ^4.14.0
  cloud_firestore: ^4.13.0
  provider: ^6.0.0
  intl: ^0.19.0
  uuid: ^4.0.0
  shared_preferences: ^2.2.0
  flutter_local_notifications: ^16.1.0
  timezone: ^0.9.4
  flutter_map: ^6.0.0
  latlong2: ^0.9.1
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  image_picker: ^1.0.4
  fl_chart: ^0.62.0
  workmanager: ^0.5.2
  google_fonts: ^6.1.0
  flutter_animate: ^4.2.0
  smooth_page_indicator: ^1.1.0
  percent_indicator: ^4.1.1
  table_calendar: ^3.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
